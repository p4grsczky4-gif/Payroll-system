<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5f5ce6">
  <title>HR- og lønnssystem Demo</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HR og lønn">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">

  <style>

:root{
  --bg:#f6f7fb;--panel:#ffffff;--panel-2:#f0f2fa;--text:#17182b;--muted:#6f7287;
  --line:#e2e5ef;--primary:#5f5ce6;--primary-2:#7c72ff;--primary-soft:#ecebff;
  --success:#16835f;--success-soft:#e7f7f1;--warning:#b96f00;--warning-soft:#fff3df;
  --danger:#c43f51;--danger-soft:#fdecef;--shadow:0 12px 30px rgba(31,34,71,.08);
  --radius:20px;--radius-sm:13px;
}
html[data-theme="dark"]{
  --bg:#11131d;--panel:#191c28;--panel-2:#222637;--text:#f5f6ff;--muted:#a7acc1;
  --line:#303548;--primary:#8c85ff;--primary-2:#6f68e8;--primary-soft:#2c2a52;
  --success:#58c69f;--success-soft:#18382f;--warning:#f0b454;--warning-soft:#3a2d18;
  --danger:#ff8190;--danger-soft:#401f27;--shadow:0 14px 35px rgba(0,0,0,.28);
}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{margin:0;min-height:100vh;background:var(--bg)}button,input,select,textarea{font:inherit}
button{cursor:pointer}.mobile-only{display:none!important}
#appShell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;background:linear-gradient(180deg,#242044 0%,#17162c 100%);color:white;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 24px}.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#8b85ff,#5f5ce6);font-weight:900;font-size:22px;box-shadow:0 10px 20px rgba(95,92,230,.35)}
.brand strong,.brand span{display:block}.brand span{font-size:12px;color:#b9b6db;margin-top:2px}
#mainNav{display:grid;gap:6px;padding-bottom:14px}.nav-item{-webkit-appearance:none;appearance:none;border:1px solid rgba(255,255,255,.045);background:rgba(255,255,255,.035);color:#d4d1e8;padding:12px 13px;border-radius:13px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:700;flex:0 0 auto}
.nav-item span{width:24px;text-align:center;font-size:18px}.nav-item:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.11);color:#fff}.nav-item.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.13)}
.sidebar-footer{margin-top:auto;padding:18px 10px 8px;display:grid;gap:3px;color:#d7d4e9;flex:0 0 auto}.sidebar-footer small{color:#aaa6c8}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px 30px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
.eyebrow{margin:0 0 4px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}.topbar h1{margin:0;font-size:29px;letter-spacing:-.03em}
.topbar-actions{display:flex;gap:10px;align-items:center}.role-switch{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.role-switch span{font-size:12px;color:var(--muted);font-weight:800}.role-switch select{border:0;background:transparent;color:var(--text);font-weight:800;outline:0}
.icon-btn{width:43px;height:43px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);box-shadow:var(--shadow);display:grid;place-items:center}
.view-root{padding:4px 30px 45px;max-width:1600px;margin:0 auto}.page-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:800;background:var(--panel-2);color:var(--text);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white}.btn.success{background:var(--success);color:white}.btn.danger{background:var(--danger);color:white}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 10px;border-radius:10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:18px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0}
.stat-card{position:relative;overflow:hidden}.stat-card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-30px;top:-30px;background:var(--primary-soft)}
.stat-label{color:var(--muted);font-size:13px;font-weight:800}.stat-value{font-size:30px;font-weight:900;letter-spacing:-.04em;margin-top:8px}.stat-note{color:var(--muted);font-size:12px;margin-top:7px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.section-title h2,.section-title h3{margin:0}.section-title small{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap}.search,.field input,.field select,.field textarea,.filters input,.filters select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 12px;outline:0}
.search{min-width:240px}.field input:focus,.field select:focus,.field textarea:focus,.filters input:focus,.filters select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px}table{border-collapse:collapse;width:100%;min-width:760px;background:var(--panel)}
th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel-2)}
tr:last-child td{border-bottom:0}.money{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--panel-2);color:var(--muted)}
.badge.success{background:var(--success-soft);color:var(--success)}.badge.warning{background:var(--warning-soft);color:var(--warning)}.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.primary{background:var(--primary-soft);color:var(--primary)}
.list{display:grid;gap:10px}.list-item{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px 14px}.list-item strong{display:block}.list-item small{display:block;color:var(--muted);margin-top:3px}
.progress{height:9px;border-radius:99px;background:var(--panel-2);overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:var(--muted)}.field textarea{min-height:90px;resize:vertical}
.inline-check{display:flex;align-items:center;gap:8px;font-weight:700}.inline-check input{width:auto}.help{font-size:12px;color:var(--muted);line-height:1.45}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(8,8,20,.58);display:grid;place-items:center;padding:18px}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:22px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-header,.modal-footer{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.modal-footer{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.modal-body{padding:20px}
.toast-host{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:9px}.toast{background:var(--text);color:var(--panel);padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);font-weight:800;animation:toastIn .18s ease-out}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}.empty .empty-icon{font-size:36px;margin-bottom:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.segmented{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:14px;gap:5px;box-shadow:var(--shadow);max-width:100%}.segmented button{-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-weight:800;padding:9px 11px;border-radius:10px}.segmented button:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}.segmented button.active{border-color:transparent;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 12px rgba(95,92,230,.22)}
.employee-card{display:grid;gap:12px}.employee-head{display:flex;justify-content:space-between;gap:10px}.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-weight:900}
.employee-main{display:flex;gap:12px;align-items:center}.employee-meta{display:flex;gap:8px;flex-wrap:wrap}.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-kpi{background:var(--panel-2);padding:10px;border-radius:11px}.mini-kpi small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.mini-kpi strong{display:block;margin-top:3px}
.timeline{display:grid;gap:12px}.timeline-item{display:grid;grid-template-columns:14px 1fr;gap:12px}.timeline-dot{width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:4px;box-shadow:0 0 0 4px var(--primary-soft)}
.notice{border-radius:14px;padding:13px 15px;background:var(--primary-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--primary) 25%,var(--line))}
.notice.warning{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 28%,var(--line))}.notice.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 28%,var(--line))}
.plan-card{display:grid;gap:12px;border:1px solid var(--line);border-radius:16px;padding:15px;background:var(--panel)}
.plan-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.plan-head strong{display:block}.plan-head small{display:block;color:var(--muted);margin-top:3px}
.plan-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.plan-stat{background:var(--panel-2);padding:10px;border-radius:11px}.plan-stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.plan-stat strong{display:block;margin-top:3px}
.payslip{max-width:850px;margin:auto;background:white;color:#17182b;border-radius:16px;padding:30px;box-shadow:var(--shadow)}.payslip-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #17182b;padding-bottom:16px}.payslip-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}.payslip table{min-width:0}.payslip .totals{margin-left:auto;width:min(370px,100%);display:grid;gap:8px}.total-row{display:flex;justify-content:space-between;padding:7px 0}.total-row.net{font-size:20px;font-weight:900;border-top:2px solid #17182b;padding-top:12px}
.mobile-cards{display:none}.actions{display:flex;gap:7px;flex-wrap:wrap}.right{text-align:right}
@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  #appShell{display:block}.sidebar{position:fixed;z-index:90;left:0;top:0;bottom:0;width:280px;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}
  .mobile-only{display:grid!important}.topbar{padding:15px 16px}.topbar>div:first-child{display:grid;grid-template-columns:43px 1fr;column-gap:10px}.topbar .eyebrow,.topbar h1{grid-column:2}.topbar .eyebrow{margin-top:-39px}.topbar h1{font-size:24px}
  .role-switch span{display:none}.role-switch select{max-width:145px}.view-root{padding:5px 14px 100px}.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.desktop-table{display:none}.mobile-cards{display:grid;gap:12px}.search{min-width:0}
  .payslip{padding:20px 14px}.payslip-grid{grid-template-columns:1fr}.payslip-head{display:grid}.topbar-actions{gap:6px}
}
@media(max-width:480px){.grid.cols-4{grid-template-columns:1fr 1fr}.stat-value{font-size:23px}.card{padding:16px}.role-switch{padding:7px}.role-switch select{max-width:115px;font-size:12px}}

.cost-bar-list{display:grid;gap:12px}.cost-bar-row{display:grid;grid-template-columns:minmax(160px,1.1fr) 2fr auto;gap:12px;align-items:center}.cost-bar-track{height:12px;background:var(--panel-2);border-radius:999px;overflow:hidden}.cost-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:999px}.cost-bar-label small{display:block;color:var(--muted);margin-top:2px}.cost-total{font-variant-numeric:tabular-nums;font-weight:900}.service-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900}.economy-note{font-size:12px;color:var(--muted);line-height:1.55}.profile-summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
@media(max-width:820px){.cost-bar-row{grid-template-columns:1fr}.cost-total{text-align:left}.cost-bar-track{height:10px}}
@media print{
  body{background:white}.sidebar,.topbar,.page-actions,.no-print,.toast-host{display:none!important}.main,.view-root{padding:0!important}.card{box-shadow:none;border:0}.payslip{box-shadow:none;padding:0;max-width:none}
}

  
.salary-table-input{width:150px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.salary-table-input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.standard-salary-box{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 24%,var(--line));border-radius:14px;padding:13px 14px}
.standard-salary-box .help{margin:3px 0 0 26px}
.position-code-label{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums}
.position-code-summary{display:grid;gap:3px}
.position-code-summary small{color:var(--muted)}
.role-context[hidden]{display:none!important}
.subtotal-row td{background:var(--primary-soft);font-weight:900;border-top:2px solid color-mix(in srgb,var(--primary) 35%,var(--line))}
.report-group-start td{border-top:2px solid var(--line)}
.readonly-note{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--muted)}



.hidden{display:none!important}.role-note{font-size:12px;color:var(--muted)}
.contract{max-width:900px;margin:auto;background:#fff;color:#17182b;border-radius:16px;padding:34px;box-shadow:var(--shadow)}
.contract h2,.contract h3{margin-top:0}.contract-head{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #17182b;padding-bottom:16px;margin-bottom:20px}
.contract-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}.contract-field{padding:9px 0;border-bottom:1px solid #e2e5ef}.contract-field small{display:block;color:#6f7287;font-size:11px;text-transform:uppercase;font-weight:800}.contract-field strong{display:block;margin-top:3px}
.contract-section{margin-top:24px}.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}.signature-line{border-top:1px solid #17182b;padding-top:7px}
.absence-balance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.balance-box{background:var(--panel-2);padding:12px;border-radius:12px}.balance-box small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.balance-box strong{display:block;margin-top:4px;font-size:20px}
.role-card{border-left:4px solid var(--primary)}
.approval-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:820px){.contract{padding:20px 14px}.contract-grid,.signature-grid{grid-template-columns:1fr}.absence-balance{grid-template-columns:1fr 1fr}}
@media print{.contract{box-shadow:none;padding:0;max-width:none}.contract-actions{display:none!important}}

.finance-summary{display:grid;gap:8px}
.finance-negative{color:var(--danger)}
.finance-positive{color:var(--success)}


.product-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.product-card{display:grid;gap:10px;border:1px solid var(--line);border-radius:17px;padding:16px;background:var(--panel);min-width:0}
.product-card .product-icon{width:48px;height:48px;border-radius:14px;background:var(--primary-soft);display:grid;place-items:center;font-size:26px}
.product-card h3{margin:0;font-size:17px}.product-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.product-price{font-size:20px;font-weight:900;letter-spacing:-.02em}
.cart-panel{position:sticky;top:104px}.cart-line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-line:last-child{border-bottom:0}.cart-line strong{display:block}.cart-line small{display:block;color:var(--muted);margin-top:3px}
.qty-control{display:flex;align-items:center;gap:6px}.qty-control button{width:29px;height:29px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:9px;font-weight:900}
.qty-control span{min-width:24px;text-align:center;font-weight:900}
.order-summary{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:13px;margin-top:12px}.order-summary>div{display:flex;justify-content:space-between;gap:12px}
.order-summary .grand{font-size:19px;font-weight:900}
.receipt-card{display:grid;gap:12px}.receipt-progress{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stock-low{color:var(--danger);font-weight:900}.stock-ok{color:var(--success);font-weight:900}
.line-editor{display:grid;gap:9px}.line-editor-row{display:grid;grid-template-columns:minmax(160px,1.6fr) 90px 120px 44px;gap:8px;align-items:end;border:1px solid var(--line);border-radius:13px;padding:10px}
.purchase-order{max-width:900px;margin:auto;background:white;color:#17182b;padding:34px;border-radius:16px}.purchase-order h1,.purchase-order h2,.purchase-order h3{margin-top:0}
@media(max-width:1200px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product-layout{grid-template-columns:minmax(0,1fr) 320px}}
@media(max-width:820px){.product-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:1fr}.cart-panel{position:static}.line-editor-row{grid-template-columns:1fr 80px 110px 40px}.segmented{overflow:auto;max-width:100%;white-space:nowrap}}



.roster-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.roster-shift{display:grid;grid-template-columns:minmax(160px,1.3fr) 110px 90px 130px 100px auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel)}
.roster-shift small{display:block;color:var(--muted);margin-top:3px}
.roster-employee-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:360px;overflow:auto}
.roster-employee-choice{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
.roster-employee-choice input{width:auto}
@media(max-width:1000px){.roster-shift{grid-template-columns:1fr 100px 90px auto}.roster-shift .roster-time,.roster-shift .roster-hours{grid-column:auto}.roster-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.roster-shift{grid-template-columns:1fr}.roster-employee-list{grid-template-columns:1fr}.roster-summary{grid-template-columns:1fr 1fr}}


.control-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.control-issue{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.control-issue.critical{border-left-color:#d84b61}.control-issue.warning{border-left-color:#d89b28}.control-issue.info{border-left-color:#6477d8}
.control-issue small{display:block;color:var(--muted);margin-top:5px;line-height:1.45}

function isoDateSerial(value){

function payrollMonthBounds(period){

function employmentProration(e,period){
  const bounds=payrollMonthBounds(period);
  if(!bounds)return{factor:1,days:0,divisor:0,partial:false,method:e?.prorationMethod||'calendar',start:'',end:''};

  const method=e?.prorationMethod||'calendar';
  const employmentStart=e?.startDate||bounds.first;
  const employmentEnd=e?.endDate||bounds.last;
  if(employmentStart>bounds.last||employmentEnd<bounds.first){
    return{factor:0,days:0,divisor:method==='thirty'?30:bounds.days,partial:true,method,start:employmentStart,end:employmentEnd};
  }

  const activeStart=employmentStart>bounds.first?employmentStart:bounds.first;
  const activeEnd=employmentEnd<bounds.last?employmentEnd:bounds.last;
  const fullMonth=activeStart===bounds.first&&activeEnd===bounds.last;

  if(method==='none'){
    return{factor:1,days:bounds.days,divisor:bounds.days,partial:false,method,start:activeStart,end:activeEnd};
  }

  if(method==='thirty'){
    const startDay=activeStart===bounds.first?1:Math.min(30,Number(activeStart.slice(8,10)));
    const endDay=activeEnd===bounds.last?30:Math.min(30,Number(activeEnd.slice(8,10)));
    const days=Math.max(0,endDay-startDay+1);
    return{factor:fullMonth?1:days/30,days:fullMonth?30:days,divisor:30,partial:!fullMonth,method,start:activeStart,end:activeEnd};
  }

  const days=Math.max(0,isoDateSerial(activeEnd)-isoDateSerial(activeStart)+1);

}

function applyRoleUi(){
  ensureRoleContext();
  $$('.nav-item').forEach(button=>button.hidden=!roleCan(button.dataset.view));
  const wrap=$('#contextSwitch'),select=$('#contextSelect'),label=$('#contextLabel');

    wrap.hidden=false;label.textContent='Ansatt';
    state.employees.filter(e=>e.status!=='inactive').sort((a,b)=>a.name.localeCompare(b.name,'nb')).forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=`${e.employeeNo} – ${e.name}`;select.appendChild(o);});

function vacationBalance(e,year=yearNow()){
  const annual=Number(e?.vacationDaysAnnual??25),carried=Number(e?.vacationDaysCarried??0);
  const entries=state.absenceEntries.filter(a=>a.employeeId===e.id&&absenceTypeById(a.typeId)?.affectsVacation&&String(a.startDate||'').startsWith(String(year)));
  const approved=entries.filter(a=>['approved','included'].includes(a.status)).reduce((s,a)=>s+(a.unit==='hours'?Number(a.quantity||0)/(Number(e.weeklyHours||37.5)/5):Number(a.quantity||0)),0);
  const pending=entries.filter(a=>a.status==='submitted').reduce((s,a)=>s+(a.unit==='hours'?Number(a.quantity||0)/(Number(e.weeklyHours||37.5)/5):Number(a.quantity||0)),0);
  return {annual,carried,approved,pending,remaining:annual+carried-approved};
}

function removeAbsencePayrollEntry(a){

function createAbsencePayrollEntry(a){

function setBillingStatus(invoice,status){
  if(!invoice)return;if(status==='cancelled'&&!confirm('Kansellere faktureringen og frigjøre vaktene for ny fakturering?'))return;

  if(status==='invoiced')invoice.invoicedAt=new Date().toISOString();if(status==='paid')invoice.paidAt=new Date().toISOString();
  if(status==='cancelled')(invoice.lines||[]).forEach(line=>{const plan=state.shiftPlans.find(p=>p.id===line.shiftPlanId),shift=plan?.shifts?.find(s=>s.id===line.shiftId);if(shift&&shift.billingInvoiceId===invoice.id)shift.billingInvoiceId='';});
  audit(`${invoice.invoiceNo} ble satt til ${billingStatusText(status).toLowerCase()}.`,roleLabel(state.ui.role));queueSave();render();toast('Status oppdatert');
}

const FINANCE_CLAIM_TYPES={
  wrong_salary:'Feilutbetalt lønn',
  wrong_supplement:'Feilutbetalt tillegg eller overtid',
  salary_advance:'Lønnsforskudd',
  reimbursement:'Refusjonskrav',
  benefit_repayment:'Tilbakebetaling av ytelse',
  damage:'Egenandel eller erstatningskrav',
  other:'Annet krav'
};
function canManageFinanceInvoices(){return state.ui.role==='payroll';}
function financeInvoiceStatusText(status){return({draft:'Kladd',review:'Til kontroll',approved:'Godkjent',issued:'Fakturert',partially_paid:'Delvis betalt',paid:'Betalt',cancelled:'Kansellert'}[status]||status);}
function financeInvoiceStatusBadge(invoice){
  const status=invoice?.status||'draft';
  const cls=status==='paid'?'success':status==='cancelled'?'danger':status==='issued'||status==='partially_paid'?'warning':status==='approved'?'success':'primary';
  const overdue=financeInvoiceIsOverdue(invoice);
  return `<span class="badge ${overdue?'danger':cls}">${overdue?'Forfalt':esc(financeInvoiceStatusText(status))}</span>`;
}
function financeInvoiceTotal(invoice){return (invoice?.lines||[]).reduce((sum,line)=>sum+Number(line.amount||0),0);}
function financeInvoicePaid(invoice){return (invoice?.payments||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);}
function financeInvoiceRemaining(invoice){return Math.max(0,Math.round((financeInvoiceTotal(invoice)-financeInvoicePaid(invoice))*100)/100);}
function financeInvoiceIsOverdue(invoice){return !!invoice&&invoice.status!=='paid'&&invoice.status!=='cancelled'&&invoice.status!=='draft'&&invoice.dueDate&&invoice.dueDate<today()&&financeInvoiceRemaining(invoice)>0;}
function financeClaimTypeText(type){return FINANCE_CLAIM_TYPES[type]||type||'Annet krav';}
function nextCustomerInvoiceNo(){const year=yearNow(),n=Math.max(1,Number(state.finance.nextCustomerInvoiceNo||1));state.finance.nextCustomerInvoiceNo=n+1;return `FAK-${year}-${String(n).padStart(4,'0')}`;}
function financeInvoiceById(id){return state.finance.customerInvoices.find(x=>x.id===id);}
function addMonthsIso(dateValue,months){const d=new Date(`${dateValue||today()}T12:00:00`);d.setMonth(d.getMonth()+Number(months||0));return d.toISOString().slice(0,10);}
function syncFinanceInvoice(invoice){
  if(!invoice)return;
  invoice.lines=Array.isArray(invoice.lines)?invoice.lines:[];
  invoice.lines.forEach(line=>{line.quantity=Math.max(0,Number(line.quantity||0));line.unitPrice=Math.max(0,Number(line.unitPrice||0));line.amount=Math.round(line.quantity*line.unitPrice*100)/100;});
  invoice.payments=Array.isArray(invoice.payments)?invoice.payments:[];
  invoice.payments.forEach(payment=>payment.amount=Math.max(0,Number(payment.amount||0)));
  invoice.installments=Array.isArray(invoice.installments)?invoice.installments:[];
  let paidLeft=financeInvoicePaid(invoice);
  invoice.installments.slice().sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))).forEach(part=>{const covered=Math.min(Number(part.amount||0),paidLeft);part.paidAmount=Math.round(covered*100)/100;part.status=covered>=Number(part.amount||0)-0.005?'paid':covered>0?'partial':part.dueDate<today()?'overdue':'open';paidLeft=Math.max(0,paidLeft-covered);});
  const total=financeInvoiceTotal(invoice),paid=financeInvoicePaid(invoice);
  if(total>0&&paid>=total-0.005){invoice.status='paid';invoice.paidAt||=new Date().toISOString();}
  else if(paid>0&&!['draft','review','approved','cancelled'].includes(invoice.status))invoice.status='partially_paid';
  invoice.updatedAt=new Date().toISOString();
}

function setFinanceInvoiceStatus(invoice,status){
  if(!canManageFinanceInvoices()||!invoice)return;

function activePositionsForControl(employee,period){return employeePositions(employee).filter(pos=>positionActiveInPeriod(pos,period));}
function rangesOverlap(a,b){
  const aStart=a.startDate||'0000-01-01',aEnd=a.endDate||'9999-12-31',bStart=b.startDate||'0000-01-01',bEnd=b.endDate||'9999-12-31';
  return aStart<=bEnd&&bStart<=aEnd;
}
function payrollControlIssues(run){
  if(!run)return[];
  const issues=[],push=(severity,id,title,detail,employeeId='')=>issues.push({severity,id,title,detail,employeeId});
  const relevantEmployees=state.employees.filter(e=>e.status==='active');
  const slips=state.payslips.filter(p=>p.runId===run.id);
  const resources=new Map();
  relevantEmployees.forEach(e=>{const key=String(resourceNumber(e)||'').trim();if(!key||key==='–')push('critical',`missing-resource-${e.id}`,'Ressursnummer mangler',`${e.name} har ikke gyldig ressursnummer.`,e.id);else{if(!resources.has(key))resources.set(key,[]);resources.get(key).push(e);}});
  resources.forEach((employees,key)=>{if(employees.length>1)push('critical',`duplicate-resource-${key}`,'Duplisert ressursnummer',`${key} brukes av ${employees.map(e=>e.name).join(', ')}.`);});

  relevantEmployees.forEach(e=>{
    const positions=activePositionsForControl(e,run.period);
    if(!positions.length&&state.variableEntries.some(v=>v.employeeId===e.id&&(v.paymentRunId===run.id||entryEarningPeriod(v)===run.period)))push('warning',`no-position-${e.id}`,'Lønnsføring uten aktiv stilling',`${e.name} har lønnsføringer, men ingen aktiv stilling i ${compactPeriod(run.period)}.`,e.id);
    const total=positions.reduce((sum,pos)=>sum+Number(positionTermsForPeriod(pos,run.period).positionPercent||0),0);
    if(total>100.0001)push('warning',`percent-over-${e.id}`,'Samlet stillingsprosent over 100 %',`${e.name} har ${total.toLocaleString('nb-NO')} % i aktive stillinger i perioden. Kontroller at dette er tilsiktet.`,e.id);
    for(let i=0;i<positions.length;i++)for(let j=i+1;j<positions.length;j++){
      const a=positions[i],b=positions[j];
      if(rangesOverlap(a,b)&&a.positionCodeId&&a.positionCodeId===b.positionCodeId&&a.workplace===b.workplace)push('warning',`overlap-${e.id}-${a.id}-${b.id}`,'Mulig overlappende arbeidsforhold',`${e.name} har samtidige stillinger med samme stillingskode og arbeidssted.`,e.id);
    }
    const bounds=payrollMonthBounds(run.period);
    positions.forEach(pos=>{
      if(pos.startDate>bounds.first&&pos.startDate<=bounds.last)push('info',`start-mid-${pos.id}`,'Oppstart midt i måneden',`${e.name} / ${pos.positionTitle}: start ${dateText(pos.startDate)}. Delmåned beregnes automatisk.`,e.id);
      if(pos.endDate>=bounds.first&&pos.endDate<bounds.last)push('info',`end-mid-${pos.id}`,'Avslutning midt i måneden',`${e.name} / ${pos.positionTitle}: slutt ${dateText(pos.endDate)}. Delmåned beregnes automatisk.`,e.id);
      salaryHistoryChangesInPeriod(pos,run.period).forEach(change=>push('info',`salary-change-${change.id}`,'Lønnsendring i perioden',`${e.name} / ${pos.positionTitle}: nye lønnsvilkår fra ${dateText(change.effectiveDate)}.`,e.id));
    });
  });

  state.variableEntries.forEach(v=>{
    const belongs=v.paymentRunId===run.id||v.paymentPeriod===run.period||(!v.paymentRunId&&entryEarningPeriod(v)===run.period);
    if(!belongs)return;
    const employee=employeeById(v.employeeId);
    if(!wageTypeById(v.wageTypeId))push('critical',`missing-wage-${v.id}`,'Ugyldig lønnskode',`${employee?.name||'Ukjent ansatt'} har en føring med lønnsart som ikke finnes.`,v.employeeId);
    if(v.status==='submitted')push('critical',`pending-variable-${v.id}`,'Variabel lønn venter på godkjenning',`${employee?.name||'Ukjent ansatt'}: ${v.comment||wageTypeById(v.wageTypeId)?.name||'føring'} er ikke godkjent.`,v.employeeId);
    if(['returned','rejected'].includes(v.status))push('warning',`returned-variable-${v.id}`,'Returnert eller avvist lønnsføring',`${employee?.name||'Ukjent ansatt'} har en post med status ${statusLabel(v.status)}.`,v.employeeId);
  });

  state.shiftPlans.filter(plan=>plan.period===run.period).forEach(plan=>{
    const pending=(plan.shifts||[]).filter(shift=>!shift.transferred);
    if(pending.length)push('warning',`roster-${plan.id}`,'Vakter er ikke overført til lønn',`${plan.name} har ${pending.length} uoverførte vakter.`);
  });

  if(['calculated','review'].includes(run.status)&&!slips.length)push('critical',`no-slips-${run.id}`,'Ingen lønnsslipper i beregnet kjøring','Kjøringen er markert som beregnet eller til kontroll, men har ingen lønnsslipper.');
  slips.forEach(slip=>{
    const employee=employeeById(slip.employeeId);
    if(Number(slip.net)<0)push('critical',`negative-net-${slip.id}`,'Negativ nettolønn',`${employee?.name||'Ukjent ansatt'} har netto ${money(slip.net)}.`,slip.employeeId);
    const deductions=Math.abs((slip.lines||[]).filter(line=>Number(line.amount)<0).reduce((sum,line)=>sum+Number(line.amount||0),0));
    if(deductions>Number(slip.gross||0)+0.01)push('critical',`deductions-${slip.id}`,'Trekk overstiger bruttolønn',`${employee?.name||'Ukjent ansatt'} har trekk ${money(deductions)} mot brutto ${money(slip.gross)}.`,slip.employeeId);
    const bank=String(employee?.bankAccount||'').replace(/\D/g,'');
    if(Number(slip.net)>0&&!/^\d{11}$/.test(bank))push('critical',`bank-${slip.id}`,'Bankkonto mangler eller er ugyldig',`${employee?.name||'Ukjent ansatt'} har positiv netto, men ikke gyldig fiktivt kontonummer.`,slip.employeeId);
  });

  if(run.calculatedAt){
    const changedEmployees=relevantEmployees.filter(e=>e.updatedAt&&e.updatedAt>run.calculatedAt);
    const changedEntries=state.variableEntries.filter(v=>(v.paymentRunId===run.id||v.runId===run.id||v.paymentPeriod===run.period)&&String(v.updatedAt||v.createdAt||'')>run.calculatedAt);
    if(changedEmployees.length||changedEntries.length)push('warning',`changed-after-${run.id}`,'Data er endret etter siste beregning',`${changedEmployees.length} ansatte og ${changedEntries.length} lønnsføringer er endret etter ${new Date(run.calculatedAt).toLocaleString('nb-NO')}. Beregn kjøringen på nytt.`);
  }
  return issues;
}
function controlSummary(run){const issues=payrollControlIssues(run);return{issues,critical:issues.filter(i=>i.severity==='critical').length,warning:issues.filter(i=>i.severity==='warning').length,info:issues.filter(i=>i.severity==='info').length};}

function attemptCloseRun(run){

function calculatePayroll(run){
  state.payslips=state.payslips.filter(p=>p.runId!==run.id);
  const selectedIds=runSelectedEmployeeIds(run);
  const employees=state.employees.filter(e=>e.status==='active'&&(selectedIds.length?selectedIds.includes(e.id):(employeePositions(e).some(p=>positionActiveInPeriod(p,run.period))||state.variableEntries.some(v=>v.employeeId===e.id&&((v.paymentRunId===run.id)||(v.status==='approved'&&!v.paymentRunId&&entryEarningPeriod(v)===run.period))))));
  let retroLinesTotal=0,retroAmountTotal=0;

  employees.forEach(e=>{
    const lines=[];
    if(run.type==='A-konto'){
      (run.specialPayments||[]).filter(item=>item.employeeId===e.id&&Number(item.amount)>0).forEach(item=>lines.push({code:'AKONTO',name:'A-konto utbetaling',quantity:1,rate:Number(item.amount),amount:Number(item.amount),type:'payment',taxable:false,pension:false,vacation:false,affectsGross:false,earningPeriod:run.period,paymentPeriod:run.period,advanceId:item.advanceId||'',reference:item.reason||run.reason||'A-konto'}));
    }else{
      const includeBase=run.includeBaseSalary!==false||!!salaryOverrideFor(run,e.id);
      if(includeBase)lines.push(...salaryLinesForRun(e,run));

      const retroLines=automaticRetroSalaryLinesForRun(e,run);
      lines.push(...retroLines);retroLinesTotal+=retroLines.length;retroAmountTotal+=retroLines.reduce((sum,line)=>sum+Number(line.amount||0),0);

      if(run.type!=='Omkjøring'&&run.type!=='Etterbetaling'){
        (e.fixedItems||[]).filter(i=>i.kind==='earning').forEach(i=>lines.push({code:'1100',name:i.name,quantity:1,rate:Number(i.amount),amount:Number(i.amount),type:'earning',taxable:true,pension:true,vacation:true,affectsGross:true,earningPeriod:run.period,paymentPeriod:run.period}));
      }

      const vars=state.variableEntries.filter(v=>{
        if(v.employeeId!==e.id)return false;
        if(v.status==='included'&&v.runId===run.id)return true;
        if(v.status!=='approved')return false;
        if(v.paymentRunId)return v.paymentRunId===run.id;
        if(v.paymentPeriod)return v.paymentPeriod===run.period;
        return entryEarningPeriod(v)===run.period;
      });

      vars.forEach(v=>{
        const w=wageTypeById(v.wageTypeId),amount=entryAmount(v),earning=entryEarningPeriod(v),afterpayment=earning<run.period;
        const originalName=v.overrideText||w?.name||'',displayCode=v.overrideCode||w?.code||'';
        lines.push({code:displayCode,name:afterpayment?`Etterbetaling – ${originalName}`:originalName,quantity:Number(v.quantity||1),rate:v.sourceTurnusImport?Number(v.rate||0):(Number(v.rate||0)>0?Number(v.rate):(w?.mode==='amount'||v.manualAmountOverride?Math.abs(amount):Math.abs(amount/(Number(v.quantity)||1)))),amount,type:amount>=0?'earning':'deduction',taxable:!!w?.taxable,pension:!!w?.pension,vacation:!!w?.vacation,affectsGross:!!w?.taxable,sourceEntryId:v.id,sourceAbsenceId:v.sourceAbsenceId||'',earningPeriod:earning,paymentPeriod:run.period,afterpayment,reference:v.sourceTurnusImport?`${Number(v.quantity||0).toLocaleString('nb-NO')} årstimer × ${Number(v.rate||0).toLocaleString('nb-NO')} kr / 12${afterpayment?` · Føringsperiode ${compactPeriod(earning)}`:''}`:(afterpayment?`Føringsperiode ${compactPeriod(earning)}`:'')});
        v.status='included';v.runId=run.id;v.paymentRunId=run.id;v.paymentPeriod=run.period;
      });

      if(run.type!=='Omkjøring'&&run.type!=='Etterbetaling'){
        (e.deductionPlans||[]).filter(p=>deductionPlanApplicable(p,run.period)).forEach(p=>{const w=wageTypeById(p.wageTypeId),remaining=deductionPlanRemaining(p),amount=p.frequency==='once'?remaining:Math.min(remaining,Number(p.installmentAmount||remaining));if(amount>0)lines.push({code:w?.code||'6290',name:w?.name||'Trekkavtale',quantity:1,rate:amount,amount:-amount,type:'deduction',taxable:false,pension:false,vacation:false,affectsGross:false,planId:p.id,reference:p.reference||'',earningPeriod:run.period,paymentPeriod:run.period});});
      }
    }

    const gross=lines.filter(l=>l.affectsGross).reduce((s,l)=>s+Number(l.amount||0),0);
    const pensionBase=lines.filter(l=>l.pension).reduce((s,l)=>s+Number(l.amount||0),0);
    const pension=run.type==='A-konto'?0:Math.max(0,pensionBase*Number(e.pensionRate||0)/100);
    const taxBase=Math.max(0,lines.filter(l=>l.taxable).reduce((s,l)=>s+Number(l.amount||0),0)-pension);
    const tax=run.type==='A-konto'?0:Math.max(0,taxBase*Number(e.taxRate||0)/100+Number(e.extraTax||0));

    if(run.type!=='A-konto'){
      if(run.type!=='Omkjøring'&&run.type!=='Etterbetaling')(e.fixedItems||[]).filter(i=>i.kind==='deduction').forEach(i=>lines.push({code:'6100',name:i.name,quantity:1,rate:Number(i.amount),amount:-Number(i.amount),type:'deduction',taxable:false,pension:false,vacation:false,affectsGross:false,earningPeriod:run.period,paymentPeriod:run.period}));
      eligibleAdvancesForRun(e,run).forEach(item=>lines.push({code:'6205',name:'Avregning A-konto',quantity:1,rate:Number(item.amount),amount:-Number(item.amount),type:'deduction',taxable:false,pension:false,vacation:false,affectsGross:false,advanceId:item.id,reference:`Utbetalt ${dateText(item.paymentDate)} · ${item.reason||'A-konto'}`,earningPeriod:run.period,paymentPeriod:run.period}));
      lines.push({code:'7000',name:`Pensjon ${e.pensionRate}%`,quantity:1,rate:pension,amount:-pension,type:'deduction',affectsGross:false,earningPeriod:run.period,paymentPeriod:run.period});
      lines.push({code:'7100',name:`Skattetrekk ${e.taxRate}%`,quantity:1,rate:tax,amount:-tax,type:'deduction',affectsGross:false,earningPeriod:run.period,paymentPeriod:run.period});
    }

    const net=lines.reduce((s,l)=>s+Number(l.amount||0),0);
    const otherDeductions=Math.abs(lines.filter(l=>l.amount<0&&!['7000','7100'].includes(l.code)&&!l.affectsGross).reduce((s,l)=>s+Number(l.amount||0),0));
    const vacationBase=lines.filter(l=>l.vacation).reduce((s,l)=>s+Number(l.amount||0),0);
    state.payslips.push({id:uid('slip'),runId:run.id,employeeId:e.id,resourceNo:resourceNumber(e),period:run.period,lines,gross,pension,tax,otherDeductions,net,vacationBase,vacationAccrued:vacationBase*Number(e.vacationRate||0)/100,positionSnapshot:employeePositions(e).filter(p=>positionActiveInPeriod(p,run.period)).map(p=>{const t=positionTermsForPeriod(p,run.period);return{id:p.id,title:t.positionTitle||p.positionTitle,percent:t.positionPercent,workplace:p.workplace,serviceCode:p.serviceCode};}),bankAccount:e.bankAccount||'',createdAt:new Date().toISOString()});
  });

  run.status='calculated';run.calculatedAt=new Date().toISOString();run.planSettled=false;
  audit(`${run.name} ble beregnet for ${employees.length} ansatte${retroLinesTotal?` med ${retroLinesTotal} automatiske etterbetalingslinjer`:''}.`,'Lønnskonsulent');queueSave();
  return{employees:employees.length,retroLines:retroLinesTotal,retroAmount:Math.round(retroAmountTotal*100)/100};
}
function settleDeductionPlans(run){if(run.planSettled)return;state.payslips.filter(p=>p.runId===run.id).forEach(slip=>{const e=employeeById(slip.employeeId);slip.lines.filter(l=>l.planId).forEach(line=>{const p=(e?.deductionPlans||[]).find(x=>x.id===line.planId);if(p)p.paidAmount=Math.min(Number(p.totalAmount||0),Number(p.paidAmount||0)+Math.abs(Number(line.amount||0)));});});run.planSettled=true;}

function maskBankAccount(value){
  const digits=String(value||'').replace(/\D/g,'');
  return digits.length===11
    ?`${digits.slice(0,4)}.${digits.slice(4,6)}.*****`
    :digits?'Ugyldig / ufullstendig':'Ikke registrert';
}
function bankBatchForRun(runId){return state.bank.batches.find(b=>b.runId===runId)||null;}
function nextBankBatchNo(){const no=`BET-${new Date().getFullYear()}-${String(state.bank.nextBatchNo).padStart(4,'0')}`;state.bank.nextBatchNo++;return no;}
function prepareBankBatch(run){
  if(!run)return alert('Velg en lønnskjøring.');
  const slips=state.payslips.filter(p=>p.runId===run.id);
  if(!slips.length)return alert('Lønnskjøringen må beregnes før betalingsforslag opprettes.');

  let batch=bankBatchForRun(run.id);
  if(batch?.status==='transferred'&&!confirm('Denne kjøringen er allerede markert som fiktivt overført. Opprette nytt betalingsforslag?'))return;

  const payments=slips
    .filter(p=>Number(p.net||0)>0)
    .map(p=>{
      const e=employeeById(p.employeeId);
      const account=String(e?.bankAccount||'').replace(/\D/g,'');
      return{
        id:uid('pay'),
        employeeId:p.employeeId,
        resourceNo:resourceNumber(e),
        employeeName:e?.name||'',
        bankAccount:account,
        amount:Number(p.net||0),
        reference:`${run.type==='A-konto'?'A-konto':run.type==='Omkjøring'?'Omkjøring':'Lønn'} ${compactPeriod(run.period)} · Ressurs ${resourceNumber(e)}`,
        status:/^\d{11}$/.test(account)?'ready':'missing'
      };
    });

  const obj={
    id:batch?.id||uid('bank'),
    batchNo:batch?.batchNo||nextBankBatchNo(),
    runId:run.id,
    period:run.period,
    status:'draft',
    payments,
    createdAt:batch?.createdAt||new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    transferredAt:''
  };

  if(batch)Object.assign(batch,obj);
  else state.bank.batches.unshift(obj);

  audit(`${obj.batchNo} ble opprettet som fiktivt betalingsforslag for ${compactPeriod(run.period)}.`,'Lønnskonsulent');
  queueSave();
  render();
  toast('Betalingsforslag er opprettet');
}
function updateFictionalBankAccount(employee,account,runId=''){
  if(!employee)return false;
  const digits=String(account||'').replace(/\D/g,'');
  if(!/^\d{11}$/.test(digits))return false;

  employee.bankAccount=digits;
  employee.updatedAt=new Date().toISOString();

  const batch=bankBatchForRun(runId);
  const payment=batch?.payments?.find(p=>p.employeeId===employee.id);
  if(payment&&batch.status!=='transferred'){
    payment.bankAccount=digits;
    payment.status='ready';
    batch.updatedAt=new Date().toISOString();
  }

  audit(`Fiktiv bankkonto ble registrert for ${employee.name}.`,'Lønnskonsulent');
  queueSave();
  return true;
}
function bankAccountModal(employee,runId=''){

}
function transferBankBatch(batch){
  if(!batch||batch.status==='transferred')return;
  const missing=batch.payments.filter(p=>p.status==='missing'||!/^\d{11}$/.test(String(p.bankAccount||'').replace(/\D/g,'')));
  if(missing.length){
    return alert(`${missing.length} utbetalinger mangler gyldig fiktivt bankkontonummer. Bruk «Legg inn konto» på de aktuelle radene først.`);
  }
  if(!confirm(`Overføre ${batch.payments.length} fiktive betalinger på totalt ${money(batch.payments.reduce((s,p)=>s+Number(p.amount||0),0))}?\n\nIngen ekte bankoverføring skjer.`))return;

  batch.status='transferred';
  batch.transferredAt=new Date().toISOString();
  batch.updatedAt=batch.transferredAt;
  batch.payments.forEach(p=>p.status='transferred');
  state.advances.filter(item=>item.runId===batch.runId&&item.status==='approved').forEach(item=>{item.status='paid';item.paidAt=batch.transferredAt;item.updatedAt=batch.transferredAt;});

  audit(`${batch.batchNo} ble markert som fiktivt overført.`,'Lønnskonsulent');
  queueSave();
  render();
  toast('Fiktiv overføring er gjennomført');
}
function exportBankBatch(batch){

}

function reportingControls(snapshot){

  snapshot.runs.filter(run=>run.status!=='closed').forEach(run=>add('warning','DEMO-A010','Lønnskjøring er ikke avsluttet',`${run.name} har status ${statusLabel(run.status)}.`));

    if(row.endDate&&row.startDate&&row.endDate<row.startDate)add('critical','DEMO-A103','Sluttdato før startdato',`${row.name} · ${row.positionTitle}.`,row.employeeId,row.positionId);

    if(row.positionPercent<0||row.positionPercent>100)add('warning','DEMO-A105','Ugyldig stillingsprosent',`${row.name} · ${row.positionTitle}: ${row.positionPercent} %.`,row.employeeId,row.positionId);
    if(!row.serviceCode)add('warning','DEMO-A106','Tjeneste mangler',`${row.name} · ${row.positionTitle}.`,row.employeeId,row.positionId);
    if(!row.workplace)add('warning','DEMO-A107','Arbeidssted mangler',`${row.name} · ${row.positionTitle}.`,row.employeeId,row.positionId);
    if(!row.costCenter)add('info','DEMO-A108','Koststed mangler',`${row.name} · ${row.positionTitle}.`,row.employeeId,row.positionId);
  });
  relationIds.forEach((rows,id)=>{if(rows.length>1)rows.forEach(row=>add('critical','DEMO-A109','Duplisert arbeidsforholds-ID',`${id} brukes av ${rows.length} arbeidsforhold.`,row.employeeId,row.positionId));});
  const byEmployee=new Map();snapshot.employmentRows.forEach(row=>byEmployee.set(row.employeeId,(byEmployee.get(row.employeeId)||0)+Number(row.positionPercent||0)));byEmployee.forEach((sum,employeeId)=>{if(sum>100.01){const employee=employeeById(employeeId);add('warning','DEMO-A110','Samlet stillingsprosent over 100',`${employee?.name||employeeId}: ${sum.toLocaleString('nb-NO')} %.`,employeeId);}});
  snapshot.employeeRows.forEach(row=>{if(!snapshot.employmentRows.some(employment=>employment.employeeId===row.employeeId))add('critical','DEMO-A111','Lønn uten rapportert arbeidsforhold',`${row.name} har lønnsutbetaling, men ingen arbeidsforhold i meldingen.`,row.employeeId);const employee=employeeById(row.employeeId);if(employee&&!employee.bankAccount)add('info','DEMO-HR01','Bankkonto mangler',`${row.name} mangler fiktiv bankkonto.`,row.employeeId);});
  snapshot.incomeRows.forEach(row=>{if(!row.category||row.category==='none')add('critical','DEMO-A112','Inntekt uten rapporteringskategori',`${row.name} · ${row.code} ${row.description}.`,row.employeeId);});
  snapshot.employeeRows.forEach(row=>{const slip=state.payslips.find(item=>item.runId===row.runId&&item.employeeId===row.employeeId);const calculated=(slip?.lines||[]).filter(line=>line.affectsGross).reduce((sum,line)=>sum+Number(line.amount||0),0);if(Math.abs(calculated-row.gross)>0.02)add('critical','DEMO-A113','Differanse i bruttolønn',`${row.name}: lønnsslipp ${money(row.gross)}, linjer ${money(calculated)}.`,row.employeeId);});
  return issues;
}

function hrDataQualityIssues(period=state.ui.hrReportPeriod||monthNow()){
  const issues=[],resources=new Map(),relations=new Map(),add=(severity,category,employee,position,detail)=>issues.push({severity,category,employeeId:employee?.id||'',resourceNo:employee?resourceNumber(employee):'',name:employee?.name||'',position:position?.positionTitle||'',detail});
  state.employees.forEach(employee=>{
    const key=String(resourceNumber(employee)||'');resources.set(key,[...(resources.get(key)||[]),employee]);const positions=employeePositions(employee),active=positions.filter(position=>positionActiveInPeriod(position,period));
    if(employee.status==='active'&&!active.length)add('critical','Ingen aktiv stilling',employee,null,`Ingen stilling er aktiv i ${compactPeriod(period)}.`);
    if(!employee.managerHrCode&&!employee.manager)add('warning','Nærmeste leder mangler',employee,null,'Ingen leder eller HR-kode er registrert.');
    if(!employee.bankAccount)add('warning','Bankkonto mangler',employee,null,'Fiktiv bankkonto er ikke registrert.');

      if(!position.workplace)add('warning','Arbeidssted mangler',employee,position,'Arbeidssted er ikke angitt.');
      if(!position.serviceLocation)add('warning','Tjenestested mangler',employee,position,'Tjenestested er ikke angitt.');
      if(!position.costCenter)add('info','Koststed mangler',employee,position,'Koststed er ikke angitt.');
      if(!normalizePositionSalaryHistory(position).length)add('critical','Lønnshistorikk mangler',employee,position,'Ingen lønnsvilkår er registrert.');
      if(position.contractStatus!=='sent')add('info','Arbeidsavtale ikke sendt',employee,position,'Avtalen er ikke markert sendt.');
      if(position.endDate&&position.endDate<today()&&position.status!=='inactive')add('warning','Utgått stilling fortsatt aktiv',employee,position,`Sluttdato ${dateText(position.endDate)} er passert.`);
    });
    const percent=active.reduce((sum,position)=>sum+Number(positionTermsForPeriod(position,period).positionPercent||0),0);if(percent>100.01)add('warning','Samlet stillingsprosent over 100',employee,null,`${percent.toLocaleString('nb-NO')} % i perioden.`);
  });
  resources.forEach((employees,resource)=>{if(resource&&employees.length>1)employees.forEach(employee=>add('critical','Duplisert ressursnummer',employee,null,`${resource} brukes av ${employees.length} ansatte.`));});relations.forEach((rows,id)=>{if(rows.length>1)rows.forEach(({employee,position})=>add('critical','Duplisert arbeidsforholds-ID',employee,position,`${id} brukes av ${rows.length} stillinger.`));});return issues;
}

function costForSlip(p){const vacation=Math.max(0,Number(p.vacationAccrued||0)),aga=Math.max(0,Number(p.gross||0))*Number(state.meta.employerTaxRate||0)/100,pension=Math.max(0,Number(p.gross||0))*Number(state.meta.employerPensionRate||0)/100;return {gross:p.gross,vacation,aga,pension,total:p.gross+vacation+aga+pension};}

function costGroupsForRun(run){
  if(!run)return[];
  const groups=new Map();
  state.payslips.filter(p=>p.runId===run.id).forEach(slip=>{
    const employee=employeeById(slip.employeeId);
    const serviceCode=String(employee?.serviceCode||'Ikke angitt');
    const location=String(employee?.serviceLocation||'Ikke angitt');
    const serviceName=String(employee?.serviceName||serviceByCode(serviceCode)?.name||employee?.department||'Ikke angitt');
    const key=`${serviceCode}|${location}`;
    if(!groups.has(key))groups.set(key,{
      serviceCode,
      serviceName,
      location,
      employeeIds:new Set(),
      gross:0,
      vacation:0,
      employerTax:0,
      pension:0,
      total:0
    });
    const group=groups.get(key),cost=costForSlip(slip);
    if(employee?.id)group.employeeIds.add(employee.id);
    group.gross+=Number(cost.gross||0);
    group.vacation+=Number(cost.vacation||0);
    group.employerTax+=Number(cost.aga||0);
    group.pension+=Number(cost.pension||0);
    group.total+=Number(cost.total||0);
  });
  return[...groups.values()].map(group=>({
    ...group,
    employees:group.employeeIds.size
  })).sort((a,b)=>b.total-a.total||a.serviceCode.localeCompare(b.serviceCode,'nb')||a.location.localeCompare(b.location,'nb'));
}

function recalcOrder(order){

function adjustInventory(productId,serviceLocation,quantity,type='adjustment',reference='',note=''){
  const product=catalogProduct(productId);if(!product||!product.stockManaged||!Number(quantity))return;
  const location=serviceLocation||'Ikke angitt';

  if(!item){item={id:uid('stock'),productId,serviceLocation:location,quantity:0,updatedAt:new Date().toISOString()};state.finance.inventory.push(item);}

function operatingAccountingLines(year){
  const orderLines=[];
  state.finance.orders.forEach(order=>{
    const receipts=Array.isArray(order.receipts)?order.receipts:[];
    if(receipts.length){
      receipts.filter(r=>String(r.date||'').startsWith(String(year))).forEach(receipt=>{
        (receipt.lines||[]).forEach(receiptLine=>{
          const line=(order.lines||[]).find(l=>l.id===receiptLine.lineId);if(!line)return;
          const amount=Number(receiptLine.quantity||0)*Number(line.unitPrice||0);if(!amount)return;
          orderLines.push({date:receipt.date,voucher:receipt.receiptNo||`VM-${String(receipt.id).slice(-6).toUpperCase()}`,account:financeAccountForCategory(line.category),description:`${order.orderNo} · ${line.name} · ${order.supplier}`,serviceCode:order.serviceCode,serviceLocation:order.serviceLocation,amount,source:'Varemottak',orderId:order.id,receiptId:receipt.id});
        });
      });
    }else if(order.status==='received'&&String(order.receivedDate||order.orderDate||order.requestDate||'').startsWith(String(year))){
      orderLines.push({date:order.receivedDate||order.orderDate||order.requestDate,voucher:`BEST-${String(order.id).slice(-6).toUpperCase()}`,account:financeAccountForCategory(order.category),description:`${order.orderNo||''} · ${order.supplier} – ${order.description}`,serviceCode:order.serviceCode,serviceLocation:order.serviceLocation,amount:Number(order.amount||0),source:'Bestilling',orderId:order.id});
    }
  });
  const manual=state.finance.ledger.filter(l=>String(l.date||'').startsWith(String(year))).map(l=>({...l,source:l.source||'Manuelt bilag'}));
  return[...orderLines,...manual];
}
function financeActuals(year,serviceCode='',serviceLocation=''){
  const salary=payrollCostLinesForYear(year).filter(l=>(!serviceCode||l.serviceCode===serviceCode)&&(!serviceLocation||l.serviceLocation===serviceLocation)).reduce((s,l)=>s+Number(l.amount||0),0);
  const operating=operatingAccountingLines(year).filter(l=>(!serviceCode||l.serviceCode===serviceCode)&&(!serviceLocation||l.serviceLocation===serviceLocation)).reduce((s,l)=>s+Number(l.amount||0),0);
  return{salary,operating,total:salary+operating};
}
function budgetComparisonRows(year){

  if(order.status==='approved')actions.push(`<button class="btn small primary" data-order-action="ordered" data-id="${order.id}">Marker bestilt</button>`);

function normalizeHeader(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');}
function valueBy(row,names){const map={};Object.entries(row||{}).forEach(([k,v])=>map[normalizeHeader(k)]=v);for(const name of names){const key=normalizeHeader(name);if(map[key]!==undefined&&map[key]!==null&&map[key]!=='')return map[key];}return'';}
function excelDate(v){if(!v)return'';if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number'&&window.XLSX?.SSF){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;}const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);}
function boolValue(v){return ['ja','true','1','yes','x'].includes(String(v||'').trim().toLowerCase());}
function salaryTypeValue(v){return /time/i.test(String(v||''))?'hourly':'monthly';}
function statusValue(v){return /inaktiv/i.test(String(v||''))?'inactive':'active';}
function findSheetName(wb,candidates){return wb.SheetNames.find(n=>candidates.some(c=>normalizeHeader(n)===normalizeHeader(c)));}
async function ensureXlsxLibrary(){
  if(window.XLSX)return window.XLSX;
  await new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-sheetjs-loader]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',()=>reject(new Error('Excel-biblioteket kunne ikke lastes.')),{once:true});return;}
    const script=document.createElement('script');script.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';script.dataset.sheetjsLoader='true';script.onload=resolve;script.onerror=()=>reject(new Error('Excel-import krever internettilgang for å laste det lokale lesebiblioteket. Ingen ansattdata blir sendt.'));document.head.appendChild(script);
  });
  return window.XLSX;
}


function normalizePayrollPeriod(value,fallback=''){
  const raw=String(value||'').trim();
  if(/^\d{6}$/.test(raw))return `${raw.slice(0,4)}-${raw.slice(4,6)}`;
  if(/^\d{4}-\d{2}$/.test(raw))return raw;
  if(value instanceof Date)return value.toISOString().slice(0,7);
  return fallback;
}

function turnusEmployeeByResource(resourceNo){
  const key=String(resourceNo||'').trim();
  if(!key)return null;
  let employees=state.employees.filter(e=>e.status!=='inactive');
  if(state.ui.role==='nearest'){
    const allowed=scopedEmployeeIds();
    employees=employees.filter(e=>allowed.has(e.id));
  }
  return employees.find(e=>String(resourceNumber(e)).trim()===key)||null;
}

function openRunForPeriod(period){
  const normalized=normalizePayrollPeriod(period,'');
  if(normalized)return state.runs.find(r=>r.status!=='closed'&&r.period===normalized)||null;
  return paymentRun();
}

function turnusImportEntryKey(employeeId,earningPeriod,wageTypeId,paymentRunId){
  return `${employeeId}|${earningPeriod}|${wageTypeId}|${paymentRunId}`;
}

async function importTurnusExcel(file){
  await ensureXlsxLibrary();
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const sheetName=findSheetName(wb,['Turnus','Turnusimport','Faste turnustillegg']);
  if(!sheetName)throw new Error('Fant ikke arket «Turnus».');

  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:''});
  if(!rows.length)throw new Error('Arket «Turnus» inneholder ingen rader.');

  const categories=[
    {
      key:'evening',
      label:'kveld',
      wageTypeId:TURNUS_WAGE_TYPE_IDS.evening,
      rate:TURNUS_RATES.evening,
      headers:['Årstimer kveld','Arstimer kveld','Kveldstimer','Kveld','Timer kveld']
    },
    {
      key:'night',
      label:'natt',
      wageTypeId:TURNUS_WAGE_TYPE_IDS.night,
      rate:TURNUS_RATES.night,
      headers:['Årstimer natt','Arstimer natt','Nattetimer','Natt','Timer natt']
    },
    {
      key:'weekend',
      label:'helg',
      wageTypeId:TURNUS_WAGE_TYPE_IDS.weekend,
      rate:TURNUS_RATES.weekend,
      headers:['Årstimer helg','Arstimer helg','Helgetimer','Helg','Timer helg','Lørdag søndag','Lordag sondag']
    }
  ];

  let created=0,updated=0,removed=0,skipped=0;
  const missingResources=new Set();
  const missingRuns=new Set();

  rows.forEach(row=>{
    const resourceNo=String(valueBy(row,['Ressursnummer','Ressurs nr','Ressurs'])).trim();
    if(!resourceNo)return;

    const employee=turnusEmployeeByResource(resourceNo);
    if(!employee){
      missingResources.add(resourceNo);
      skipped++;
      return;
    }

    const earningPeriod=normalizePayrollPeriod(
      valueBy(row,['Føringsperiode','Foringsperiode','Opptjeningsperiode','Turnusperiode']),
      paymentRun()?.period||monthNow()
    );

    const requestedPaymentPeriod=normalizePayrollPeriod(
      valueBy(row,['Utbetalingsperiode','Lønnsperiode','Lonnskjoringsperiode']),
      ''
    );

    const run=openRunForPeriod(requestedPaymentPeriod);
    if(!run){
      missingRuns.add(requestedPaymentPeriod||'ingen åpen periode');
      skipped++;
      return;
    }

    const comment=String(valueBy(row,['Kommentar','Merknad'])||'').trim();
    const importDate=excelDate(valueBy(row,['Dato','Virkningsdato']))||`${earningPeriod}-01`;

    categories.forEach(category=>{
      const raw=valueBy(row,category.headers);
      if(raw==='')return;

      const annualHours=Number(String(raw).replace(',','.'))||0;
      const key=turnusImportEntryKey(employee.id,earningPeriod,category.wageTypeId,run.id);

      const existing=state.variableEntries.find(v=>
        v.sourceTurnusImport===true&&
        turnusImportEntryKey(v.employeeId,entryEarningPeriod(v),v.wageTypeId,v.paymentRunId||v.runId||'')===key
      );

      if(annualHours<=0){
        if(existing&&!(existing.status==='included'&&run.status==='closed')){
          state.variableEntries=state.variableEntries.filter(v=>v!==existing);
          removed++;
        }
        return;
      }

      const monthlyAmount=Math.round((annualHours*category.rate/12)*100)/100;
      const obj={
        id:existing?.id||uid('ve_turnus'),
        employeeId:employee.id,
        wageTypeId:category.wageTypeId,
        earningPeriod,
        date:importDate,
        quantity:annualHours,
        rate:category.rate,
        amount:monthlyAmount,
        comment:`Turnusimport ${category.label}: ${annualHours.toLocaleString('nb-NO')} årstimer × ${category.rate.toLocaleString('nb-NO')} kr / 12${comment?` · ${comment}`:''}`,
        status:'approved',
        createdBy:'Turnusimport Excel',
        createdAt:existing?.createdAt||new Date().toISOString(),
        updatedAt:new Date().toISOString(),
        paymentRunId:run.id,
        paymentPeriod:run.period,
        runId:existing?.runId===run.id?run.id:'',
        sourceTurnusImport:true,
        turnusCategory:category.key,
        resourceNoAtImport:resourceNo
      };

      if(existing){
        Object.assign(existing,obj);
        updated++;
      }else{
        state.variableEntries.unshift(obj);
        created++;
      }
    });
  });

  audit(
    `Turnusimport: ${created} opprettet, ${updated} oppdatert, ${removed} fjernet og ${skipped} rader hoppet over.`,
    roleLabel(state.ui.role)
  );
  queueSave();
  render();

  let message=`Turnusimport fullført.\n\nOpprettet: ${created}\nOppdatert: ${updated}\nFjernet: ${removed}\nHoppet over: ${skipped}`;
  if(missingResources.size)message+=`\n\nRessursnummer ikke funnet:\n${[...missingResources].join(', ')}`;
  if(missingRuns.size)message+=`\n\nIngen åpen lønnskjøring for:\n${[...missingRuns].join(', ')}`;
  message+='\n\nBeregn aktuell lønnskjøring på nytt for å oppdatere lønnsslippene.';
  alert(message);
  toast('Turnusimporten er ferdig');
}

function employeeByResourceForRosterImport(resourceNo){
  const matches=state.employees.filter(employee=>employee.status!=='inactive'&&String(resourceNumber(employee)).trim()===String(resourceNo).trim());
  return{employee:matches[0]||null,duplicates:matches.length};
}
function externalRosterEntryByLineId(lineId){return state.variableEntries.find(entry=>entry.sourceExternalRoster===true&&entry.sourceExternalRosterLineId===lineId)||null;}

async function importExternalRosterPayroll(file){
  showImportProgress('Importerer vaktplanfil','Leser Excel-filen…',5);
  await ensureXlsxLibrary();
  const workbook=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const sheetName=findSheetName(workbook,['Lønnsgrunnlag','Lonnsgrunnlag','Payroll']);
  if(!sheetName)throw new Error('Fant ikke arket «Lønnsgrunnlag».');
  const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:''});
  if(!rows.length)throw new Error('Lønnsgrunnlaget inneholder ingen rader.');

  let created=0,updated=0,removed=0,skipped=0;
  const missingResources=new Set(),missingWageCodes=new Set(),missingRuns=new Set(),duplicateResources=new Set();
  const affectedRuns=new Set();

  for(let index=0;index<rows.length;index++){
    const row=rows[index];
    const lineId=String(valueBy(row,['Unik linje-ID','Unik linje ID','Linje-ID','Line ID'])||'').trim();
    const resourceNo=String(valueBy(row,['Ressursnummer','Ressurs nr'])||'').trim();
    const wageCode=String(valueBy(row,['Lønnskode','Lonnskode','Wage code'])||'').trim();
    const action=String(valueBy(row,['Handling','Action'])||'OPPDATER').trim().toUpperCase();
    const quantity=Number(String(valueBy(row,['Antall','Timer','Quantity'])||0).replace(',','.'))||0;
    if(!lineId||!resourceNo||!wageCode){skipped++;continue;}

    const resourceMatch=employeeByResourceForRosterImport(resourceNo);
    const employee=resourceMatch.employee;
    if(resourceMatch.duplicates>1)duplicateResources.add(resourceNo);
    if(!employee){missingResources.add(resourceNo);skipped++;continue;}

    const wageType=state.wageTypes.find(wage=>String(wage.code)===wageCode);
    if(!wageType){missingWageCodes.add(wageCode);skipped++;continue;}

    const paymentPeriod=normalizePayrollPeriod(valueBy(row,['Utbetalingsperiode','Lønnsperiode','Lonnskjoringsperiode']),'');
    const run=openRunForPeriod(paymentPeriod);
    if(!run){missingRuns.add(paymentPeriod||'ikke angitt');skipped++;continue;}

    const existing=externalRosterEntryByLineId(lineId);
    if(existing&&variableEntryLocked(existing)){skipped++;continue;}

    if(action==='SLETT'||quantity<=0){
      if(existing){
        const linked=variableEntryRun(existing);
        if(linked)affectedRuns.add(linked.id);
        state.variableEntries=state.variableEntries.filter(entry=>entry!==existing);
        removed++;
      }
      if(index%40===39){updateImportProgress(`Behandler ${index+1} av ${rows.length} linjer…`,Math.round((index+1)/rows.length*90));await importYield();}
      continue;
    }

    const positionId=String(valueBy(row,['Stillings-ID','Stilling ID','Position ID'])||'').trim();
    const earningPeriod=normalizePayrollPeriod(valueBy(row,['Føringsperiode','Foringsperiode','Opptjeningsperiode']),run.period);
    const date=excelDate(valueBy(row,['Vaktdato','Dato']))||`${earningPeriod}-01`;
    const rate=Number(String(valueBy(row,['Sats','Rate'])||0).replace(',','.'))||0;
    const amount=Number(String(valueBy(row,['Beløp','Belop','Amount'])||0).replace(',','.'))||0;
    const text=String(valueBy(row,['Lønnsarttekst','Lonnarttekst','Tekst'])||'').trim();
    const comment=String(valueBy(row,['Kommentar','Merknad'])||'Importert fra ekstern vaktplan').trim();
    const exportId=String(valueBy(row,['Eksport-ID','Export ID'])||'').trim();

    const obj={
      id:existing?.id||uid('ve_ext_roster'),
      employeeId:employee.id,
      positionId,
      wageTypeId:wageType.id,
      earningPeriod,
      date,
      quantity,
      rate,
      amount,
      overrideText:text,
      comment,
      status:'approved',
      createdBy:'Ekstern vaktplanimport',
      createdAt:existing?.createdAt||new Date().toISOString(),
      updatedAt:new Date().toISOString(),
      paymentRunId:run.id,
      paymentPeriod:run.period,
      runId:'',
      sourceExternalRoster:true,
      sourceExternalRosterLineId:lineId,
      sourceExternalRosterExportId:exportId
    };
    if(existing){Object.assign(existing,obj);updated++;}
    else{state.variableEntries.unshift(obj);created++;}
    affectedRuns.add(run.id);

    if(index%40===39){
      updateImportProgress(`Behandler ${index+1} av ${rows.length} linjer…`,Math.round((index+1)/rows.length*90));
      await importYield();
    }
  }

  updateImportProgress('Oppdaterer åpne lønnskjøringer…',94);
  for(const runId of affectedRuns){
    const run=runById(runId);
    if(run&&run.status!=='closed'&&state.payslips.some(slip=>slip.runId===run.id))calculatePayroll(run);
    await importYield();
  }

  audit(`Ekstern vaktplanimport: ${created} opprettet, ${updated} oppdatert, ${removed} fjernet og ${skipped} hoppet over.`,roleLabel(state.ui.role));
  queueSave();render();hideImportProgress();

  let message=`Vaktplanfil importert.\n\nOpprettet: ${created}\nOppdatert: ${updated}\nFjernet: ${removed}\nHoppet over: ${skipped}`;
  if(missingResources.size)message+=`\n\nRessursnummer ikke funnet:\n${[...missingResources].join(', ')}`;
  if(missingWageCodes.size)message+=`\n\nLønnskoder ikke funnet:\n${[...missingWageCodes].join(', ')}`;
  if(missingRuns.size)message+=`\n\nIngen åpen lønnskjøring for:\n${[...missingRuns].join(', ')}`;
  if(duplicateResources.size)message+=`\n\nDupliserte ressursnummer i HR-registeret (første aktive ressurs ble brukt):\n${[...duplicateResources].join(', ')}`;
  alert(message);
  toast('Vaktplanfilen er importert til lønn');
}

$('#mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view);});
$('#mobileMenuBtn').addEventListener('click',()=>$('.sidebar').classList.toggle('open'));
$('#roleSelect').addEventListener('change',e=>{state.ui.role=e.target.value;ensureRoleContext();currentView='dashboard';queueSave();render();toast(`Rolle: ${roleLabel(state.ui.role)}`);});
$('#contextSelect').addEventListener('change',e=>{if(state.ui.role==='employee')state.ui.selectedEmployeeId=e.target.value;if(state.ui.role==='nearest')state.ui.selectedLeaderHrCode=e.target.value;queueSave();render();});
$('#themeBtn').addEventListener('click',()=>{state.ui.theme=state.ui.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.ui.theme;queueSave();});
$('#importInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());state=imported;migrateState();await persistState();document.documentElement.dataset.theme=state.ui.theme||'light';$('#roleSelect').value=state.ui.role;currentView='dashboard';render();toast('Backup importert');}catch(err){alert('Kunne ikke importere backup: '+err.message);}finally{e.target.value='';}});
$('#excelImportInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{await importEmployeesExcel(file);}catch(err){console.error(err);alert('Kunne ikke importere Excel-filen: '+err.message);}finally{hideImportProgress();e.target.value='';}});
$('#turnusImportInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{await importTurnusExcel(file);}catch(err){console.error(err);alert('Kunne ikke importere turnusfilen: '+err.message);}finally{hideImportProgress();e.target.value='';}});
$('#rosterPayrollImportInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{await importExternalRosterPayroll(file);}catch(err){console.error(err);alert('Kunne ikke importere vaktplanfilen: '+err.message);}finally{hideImportProgress();e.target.value='';}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();});

(async function init(){
  try{
    state=await loadState()||defaultState();migrateState();
    const queryRole=new URLSearchParams(location.search).get('role');if(['employee','nearest','leader','payroll'].includes(queryRole))state.ui.role=queryRole;
    document.documentElement.dataset.theme=state.ui.theme||'light';$('#roleSelect').value=state.ui.role;await persistState();render();
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
  }catch(err){console.error('Oppstartfeil',err);state=defaultState();migrateState();document.documentElement.dataset.theme='light';$('#roleSelect').value='payroll';render();toast('Appen startet med en tom, sikker tilstand etter en oppstartsfeil.');}
})();
</script>
</body>
</html>
